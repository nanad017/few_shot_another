# Tiny settings for a fast CPU smoke test — NOT for real experiments.
model:
  hidden_dim: 32
  num_layers: 2
  proj_dim: 32
  dropout: 0.1

train:
  lr: 0.005
  weight_decay: 0.00001
  batch_size: 16
  epochs: 3
  temperature: 0.07
  momentum1: 0.99
  momentum2: 0.99
  negatives: 8
  seed: 42

augment:
  pgd: {instances: 1, epsilon: 0.05, steps: 1}
  mask: {ratio: 0.3, mu: 0.0, sigma: 0.1}
  sampling: {enabled: true, num_metagraphs: 2}
  dsc: {enabled: true}
  obfuscation: {enabled: true, garbage_nodes: 2}

eval:
  episodes: 5
  shots: [1, 3]
  query_per_family: 8

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a2clm"
version = "0.1.0"
description = "A2-CLM: Few-Shot Malware Detection Based on Adversarial Heterogeneous Graph Augmentation (TIFS 2024) - reimplementation"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.3",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "tqdm>=4.65",
]

[tool.setuptools.packages.find]
include = ["a2clm*"]
